<!DOCTYPE html>
<html lang="en" ng-app="portfolioApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sagar | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

<!-- AngularJS -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Archivo Black", sans-serif;
}

body{
background:#0f0f0f;
color:white;
overflow-x:hidden;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 10%;
background:#111;
position:fixed;
top:0;
width:100%;
z-index:1000;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
}

nav ul li a{
color:#aaa;
text-decoration:none;
cursor:pointer;
}

nav ul li a:hover{
color:#7c3aed;
}

/* HERO */

.hero{
display:flex;
justify-content:space-between;
align-items:center;
padding:100px 10% 10px 10%;
}

.hero-text h1{
font-size:45px;
margin:10px 0;
}

.hero-text span{
color:#7c3aed;
}

.hero-text p{
color:#aaa;
margin-top:10px;
line-height:1.6;
}

.hero-buttons{
margin-top:25px;
}

.btn{
padding:10px 18px;
background:#7c3aed;
border-radius:6px;
color:white;
text-decoration:none;
margin-right:10px;
}

/* HEXAGON */

.hexagon{
width:340px;
height:380px;
background:#7c3aed;

clip-path:polygon(
25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0% 50%
);

display:flex;
align-items:center;
justify-content:center;
}

.hexagon img{
width:320px;
height:340px;
object-fit:cover;

clip-path:polygon(
25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0% 50%
);
}

/* DIVIDER */

.divider{
width:80%;
height:1px;
background:rgba(255,255,255,0.15);
margin:30px auto;
}

/* SPA CONTENT */

.container{
padding:20px 10%;
}

.section-title{
font-size:28px;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1a1a1a;
padding:20px;
border-radius:10px;
}

.card p{
color:#aaa;
margin-top:8px;
}

.link-box a{
display:block;
background:#1a1a1a;
padding:12px;
margin:10px 0;
border-radius:6px;
color:white;
text-decoration:none;
}

.contact-icons{
display:flex;
gap:20px;
margin-top:10px;
}

.contact-icons a{
display:flex;
align-items:center;
justify-content:center;
width:40px;
height:40px;
border-radius:8px;
background:#1a1a1a;
transition:0.3s;
}

.contact-icons svg{
width:22px;
height:22px;
fill:#aaa;
transition:0.3s;
}

.contact-icons a:hover{
background:#7c3aed;
}

.contact-icons a:hover svg{
fill:white;
}

#typewriter::after{
content:"|";
animation:blink 1s infinite;
margin-left:5px;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0;}
100%{opacity:1;}
}

/* =========================
MOBILE RESPONSIVE DESIGN
========================= */

@media (max-width: 900px){

nav{
padding:15px 5%;
flex-direction:column;
align-items:flex-start;
}

nav ul{
margin-top:10px;
flex-wrap:wrap;
}

nav ul li{
margin:8px 15px 0 0;
}

/* HERO STACK */

.hero{
flex-direction:column;
text-align:center;
padding:120px 5% 10px 5%;
}

.hero-text h1{
font-size:32px;
}

.hero-text p{
font-size:14px;
}

/* HEXAGON SMALLER */

.hexagon{
width:220px;
height:250px;
margin-top:30px;
}

.hexagon img{
width:200px;
height:230px;
}

/* BUTTONS */

.hero-buttons{
display:flex;
flex-direction:column;
gap:10px;
align-items:center;
}

.btn{
margin-right:0;
}

/* GRID STACK */

.grid{
grid-template-columns:1fr;
}

/* CONTAINER */

.container{
padding:20px 5%;
}

/* TYPEWRITER HEIGHT FIX */

#typewriter{
min-height:22px;
}

}

</style>
</head>

<body>

<nav>

<div class="hexagon">

const lines = [
'Python Developer',
'AI/ML Enthusiast',
'Full-Stack Explorer',
'Problem Solver'
];

let lineIndex = 0;
let charIndex = 0;
let isDeleting = false;
const speed = 100;

function typeWriter() {

const element = document.getElementById("typewriter");
const currentLine = lines[lineIndex];

if (!isDeleting) {
element.textContent = currentLine.substring(0, charIndex++);
} else {
element.textContent = currentLine.substring(0, charIndex--);
}

if (!isDeleting && charIndex === currentLine.length + 1) {
isDeleting = true;
setTimeout(typeWriter, 1200);
return;
}

if (isDeleting && charIndex === 0) {
isDeleting = false;
lineIndex = (lineIndex + 1) % lines.length;
}

setTimeout(typeWriter, isDeleting ? 50 : speed);
}

typeWriter();

</script>

</html>
